<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cierre de Caja - Bucle While</title>
    
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 30px;
            max-width: 500px;
            margin: auto;
        }
        h2, h3 {
            color: #333;
        }
        form {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            padding: 9px 15px;
            margin-right: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }
        button[onclick="registrarVenta()"] {
            background-color: #28a745;
        }
        button[onclick="registrarVenta()"]:hover {
            background-color: #218838;
        }
        button[onclick="calcularTotalCaja()"] {
            background-color: #007bff;
        }
        button[onclick="calcularTotalCaja()"]:hover {
            background-color: #0056b3;
        }
        ul {
            background: #ffffff;
            padding: 20px 35px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
        li {
            margin-bottom: 5px;
        }
        #mensajeVenta {
            color: #28a745;
            font-weight: bold;
        }
        #totalCajaTexto {
            color: #155724;
            background-color: #d4edda;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <h2>Módulo de Caja Diaria</h2>
    <form onsubmit="return false;">
        
        <label for="tipoCambioInput">Cambio $1 USD en S/:</label><br>
        <input type="number" id="tipoCambioInput"><br>

        <label for="montoInput">Monto de Venta (S/):</label><br>
        <input type="number" id="montoInput"><br><br>

        <button type="button" onclick="registrarVenta()">Registrar Venta</button>
        <button type="button" onclick="calcularTotalCaja()">Calcular Total Acumulado</button>
    </form>

    <p id="mensajeVenta"></p>
    <h3>Historial de Ventas del Turno:</h3>
    <ul id="historialVentas"></ul>
    <h3 id="totalCajaTexto">Total en Caja: S/ 0.00 ($ 0.00 USD)</h3>

    <script>
        let ventasRegistradas = [];

        function registrarVenta() {
            let monto = parseFloat(document.getElementById("montoInput").value);
            let tc = parseFloat(document.getElementById("tipoCambioInput").value);

            if (isNaN(monto) || monto <= 0) {
                alert("Ingrese un monto válido mayor a 0.");
                return;
            }

            ventasRegistradas.push(monto);
            document.getElementById("montoInput").value = "";
            document.getElementById("mensajeVenta").innerText = "Venta de S/ " + monto.toFixed(2) + " registrada.";

            
            let lista = document.getElementById("historialVentas");
            let item = document.createElement("li");

            if (!isNaN(tc) && tc > 0) {
                let montoUSD = monto / tc;
                item.innerText = "Venta: S/ " + monto.toFixed(2) + " ( $ " + montoUSD.toFixed(2) + " USD )";
            } else {
                item.innerText = "Venta: S/ " + monto.toFixed(2);
            }

            lista.appendChild(item);
            document.getElementById("montoInput").focus();
        }

        function calcularTotalCaja() {
            let totalSoles = 0;
            let i = 0;

            
            while (i < ventasRegistradas.length) {
                totalSoles += ventasRegistradas[i];
                i++; 
            }

            let tc = parseFloat(document.getElementById("tipoCambioInput").value);

            
            if (isNaN(tc) || tc <= 0) {
                alert("Ingrese un tipo de cambio válido mayor a 0.");
                document.getElementById("totalCajaTexto").innerText = "Total acumulado en caja: S/ " + totalSoles.toFixed(2);
                return;
            }

            
            let totalDolares = totalSoles / tc;

            document.getElementById("totalCajaTexto").innerText = 
                "Total acumulado en caja: S/ " + totalSoles.toFixed(2) + " ($ " + totalDolares.toFixed(2) + " USD)";
        }
    </script>

</body>
</html>
